<!DOCTYPE html>
<html lang="tr" class="page-ribbon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişi Bazlı Yetkiler | Merkezi Güvenilir Finansal Veri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="ribbon.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="theme-menu.css">
    <link rel="stylesheet" href="kullanici-yonetimi.css">
    <link rel="stylesheet" href="kisi-yetkileri.css">
    <script>
    (function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})();
    </script>
</head>
<body>
<div class="app">

    <div class="title-bar">
        <div class="title-bar-left">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3.5L18.5 6.5V11.5C18.5 15.5 15.8 18.8 12 19.8C8.2 18.8 5.5 15.5 5.5 11.5V6.5L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <line x1="8" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="title-bar-title">Merkezi Güvenilir Finansal Veri</span>
        </div>
        <div class="title-bar-right">
            <div class="tb-user-menu">
                <div class="tb-user-row">
                    <span class="tb-user" id="tbUser">Ahmet Yılmaz</span>
                    <div class="tb-avatar" id="tbAvatar">AY</div>
                </div>
            </div>
        </div>
    </div>

    <div class="ribbon-tabs" id="ribbonTabs">
        <div class="ribbon-tab-list"></div>
        <div class="ribbon-tabs-actions">
            <div class="theme-switch-wrap">
                <button type="button" class="theme-switch is-dark" data-theme-switch role="switch" aria-checked="true" aria-label="Koyu tema">
                    <span class="theme-switch-track">
                        <i class="ti ti-sun theme-switch-icon theme-switch-icon-sun" aria-hidden="true"></i>
                        <i class="ti ti-moon theme-switch-icon theme-switch-icon-moon" aria-hidden="true"></i>
                        <span class="theme-switch-knob">
                            <i class="ti ti-moon theme-switch-knob-icon" aria-hidden="true"></i>
                        </span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div class="ribbon-body" id="ribbonBody"></div>

    <div class="page-area">
        <div class="page-body">
            <div class="ky-layout">

                <div class="table-card ky-user-panel">
                    <div class="tc-head">
                        <div>
                            <h3>Kullanıcı Ara</h3>
                            <p>Yetki tanımlanacak kişiyi seçin</p>
                        </div>
                    </div>
                    <div class="ky-search">
                        <i class="ti ti-search" aria-hidden="true"></i>
                        <input type="search" id="kyUserSearch" placeholder="Ad, e-posta veya rol ara…" autocomplete="off">
                    </div>
                    <ul class="ky-user-list" id="kyUserList"></ul>
                </div>

                <div class="table-card ky-perm-panel">
                    <div class="ky-perm-head">
                        <div class="ky-perm-head-main">
                            <h4 id="kyPermTitle">—</h4>
                            <p id="kyPermDesc">Menü ve alt menü erişimlerini düzenleyin</p>
                        </div>
                        <div class="ky-perm-head-badges" id="kyPermBadges"></div>
                    </div>
                    <div class="ky-toolbar">
                        <button type="button" class="ky-tool-btn" id="kyExpandAll">
                            <i class="ti ti-chevrons-down"></i> Tümünü aç
                        </button>
                        <button type="button" class="ky-tool-btn" id="kyCollapseAll">
                            <i class="ti ti-chevrons-up"></i> Tümünü kapat
                        </button>
                        <button type="button" class="ky-tool-btn" id="kyResetRole">
                            <i class="ti ti-refresh"></i> Rol varsayılanına dön
                        </button>
                        <button type="button" class="ky-tool-btn primary" id="kySaveBtn">
                            <i class="ti ti-device-floppy"></i> Kaydet
                        </button>
                    </div>
                    <div class="ky-tree-wrap">
                        <div class="ky-tree" id="kyPermTree"></div>
                    </div>
                    <p class="ky-save-hint" id="kySaveHint"></p>
                </div>

            </div>
        </div>
    </div>

</div>

<script src="status-bar.js"></script>
<script src="theme-toggle.js"></script>
<script src="ribbon-shell.js"></script>
<script src="api-client.js"></script>
<script src="kullanici-shared.js"></script>
<script src="kisi-yetkileri.js"></script>
</body>
</html>
