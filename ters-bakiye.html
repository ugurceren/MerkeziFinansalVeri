<!DOCTYPE html>
<html lang="tr" class="page-ribbon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ters Bakiye Raporu | Merkezi Güvenilir Finansal Veri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="ribbon.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="theme-menu.css">
    <link rel="stylesheet" href="report-results.css">
    <link rel="stylesheet" href="query-results-table.css">
    <link rel="stylesheet" href="ters-bakiye.css">
    <script>
    (function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})();
    </script>
</head>
<body>
<div class="app">
    <div class="title-bar">
        <div class="title-bar-left">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3.5L18.5 6.5V11.5C18.5 15.5 15.8 18.8 12 19.8C8.2 18.8 5.5 15.5 5.5 11.5V6.5L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <line x1="8" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="title-bar-title">Merkezi Güvenilir Finansal Veri</span>
        </div>
        <div class="title-bar-right">
            <div class="tb-user-menu">
                <div class="tb-user-row">
                    <span class="tb-user" id="tbUser">Ahmet Yılmaz</span>
                    <div class="tb-avatar" id="tbAvatar">AY</div>
                </div>
            </div>
        </div>
    </div>
    <div class="ribbon-tabs" id="ribbonTabs">
        <div class="ribbon-tab-list"></div>
        <div class="ribbon-tabs-actions">
            <div class="theme-switch-wrap">
                <button type="button" class="theme-switch is-dark" data-theme-switch role="switch" aria-checked="true" aria-label="Koyu tema">
                    <span class="theme-switch-track">
                        <i class="ti ti-sun theme-switch-icon theme-switch-icon-sun" aria-hidden="true"></i>
                        <i class="ti ti-moon theme-switch-icon theme-switch-icon-moon" aria-hidden="true"></i>
                        <span class="theme-switch-knob"><i class="ti ti-moon theme-switch-knob-icon" aria-hidden="true"></i></span>
                    </span>
                </button>
            </div>
        </div>
    </div>
    <div class="ribbon-body" id="ribbonBody"></div>
    <div class="page-area">
        <div class="page-body page-body-tb" id="pageBody">
            <section class="tb-layout" id="tbReportRoot">
                <header class="tb-toolbar">
                    <div class="tb-toolbar-criteria">
                        <div class="tb-mode-tabs" role="tablist" aria-label="Rapor modu">
                            <button type="button" class="tb-mode-btn is-active" data-mod="account" role="tab" aria-selected="true">Müşteri - Ek No</button>
                            <button type="button" class="tb-mode-btn" data-mod="ledger" role="tab" aria-selected="false">Hesap</button>
                        </div>
                        <div class="tb-criteria-toolbar">
                            <button type="button" class="filter-btn" id="tbFetchBtn">Bilgi Getir</button>
                            <button type="button" class="filter-btn filter-btn-secondary" id="tbClearBtn">Temizle</button>
                        </div>
                    </div>
                    <div class="report-toolbar-results" id="tbResultsBar">
                        <p class="report-results-info" id="tbRecordInfo"></p>
                        <button type="button" class="report-export-btn" id="tbExportBtn" title="Tüm veriyi Excel'e aktar" aria-label="Tüm veriyi Excel'e aktar" disabled></button>
                    </div>
                </header>

                <div class="tb-workspace" id="tbWorkspace">
                    <aside class="tb-criteria" id="tbCriteriaPanel" aria-label="Kriterler">
                        <header class="tb-criteria-head">
                            <h3 class="tb-criteria-title">Kriterler</h3>
                            <button type="button" class="tb-panel-toggle" id="tbCriteriaToggle" aria-expanded="true" aria-controls="tbCriteriaPanel" title="Kriterleri gizle">
                                <i class="ti ti-chevron-left" aria-hidden="true"></i>
                            </button>
                        </header>
                        <form class="tb-criteria-form" id="tbCriteriaForm" autocomplete="off">
                            <div class="tb-field-row">
                                <div class="tb-field">
                                    <label for="tbBeginDate">Başlangıç Tarihi</label>
                                    <input type="date" id="tbBeginDate" name="beginDate" required>
                                </div>
                                <div class="tb-field">
                                    <label for="tbEndDate">Bitiş Tarihi</label>
                                    <input type="date" id="tbEndDate" name="endDate" required>
                                </div>
                            </div>
                            <div class="tb-field tb-field-account">
                                <label for="tbAccountNumber">Müşteri No</label>
                                <input type="number" id="tbAccountNumber" name="accountNumber" inputmode="numeric" placeholder="Tek müşteri no (opsiyonel)">
                            </div>
                            <div class="tb-field tb-field-account">
                                <label for="tbAccountList">Müşteri No Listesi</label>
                                <textarea id="tbAccountList" name="accountNumberList" rows="2" placeholder="Virgül veya satır ile: 400139, 400147"></textarea>
                            </div>
                            <div class="tb-field-row tb-field-ledger-row">
                                <div class="tb-field">
                                    <label for="tbMinLedger">Min Hesap No</label>
                                    <input type="text" id="tbMinLedger" name="minLedgerCode" maxlength="50">
                                </div>
                                <div class="tb-field">
                                    <label for="tbMaxLedger">Max Hesap No</label>
                                    <input type="text" id="tbMaxLedger" name="maxLedgerCode" maxlength="50">
                                </div>
                            </div>
                            <div class="tb-field tb-field-account">
                                <label for="tbBranchId">Şube</label>
                                <input type="number" id="tbBranchId" name="branchId" inputmode="numeric" placeholder="Boş = hepsi">
                            </div>
                            <div class="tb-field-row">
                                <div class="tb-field">
                                    <label for="tbFECId">Döviz Kodu</label>
                                    <input type="number" id="tbFECId" name="fecId" inputmode="numeric" placeholder="Boş = hepsi">
                                </div>
                                <div class="tb-field">
                                    <label for="tbLedgerTypeId">Defter Tipi</label>
                                    <input type="number" id="tbLedgerTypeId" name="ledgerTypeId" inputmode="numeric" placeholder="Boş = hepsi">
                                </div>
                            </div>
                            <div class="tb-field-row">
                                <div class="tb-field">
                                    <label for="tbCreditCardFlag">Kredi Kartı Hesabı</label>
                                    <select id="tbCreditCardFlag" name="creditCardLedgerFlag">
                                        <option value="">Hepsi</option>
                                        <option value="1">Evet</option>
                                        <option value="0">Hayır</option>
                                    </select>
                                </div>
                                <div class="tb-field">
                                    <label for="tbIncomeLossFlag">Gelir Gider Hesabı</label>
                                    <select id="tbIncomeLossFlag" name="incomeLossLedgerFlag">
                                        <option value="">Hepsi</option>
                                        <option value="1">Evet</option>
                                        <option value="0">Hayır</option>
                                    </select>
                                </div>
                            </div>
                            <div class="tb-field-row">
                                <div class="tb-field tb-field-account">
                                    <label for="tbRiskStatusId">Müşteri Statüsü</label>
                                    <input type="number" id="tbRiskStatusId" name="customerRiskStatusId" inputmode="numeric" placeholder="Boş = hepsi">
                                </div>
                                <div class="tb-field tb-field-min-balance">
                                    <label for="tbMinBalance">Min Bakiye</label>
                                    <input type="number" id="tbMinBalance" name="minBalance" step="0.01" placeholder="Boş = tümü">
                                </div>
                            </div>
                            <div class="tb-field tb-field-account tb-field-check">
                                <label class="tb-check-label" for="tbKtFlag">
                                    <span>Sadece KT Müşteri Numarası</span>
                                    <input type="checkbox" id="tbKtFlag" name="accountNumberKTFlag" value="1">
                                </label>
                            </div>
                        </form>
                    </aside>

                    <button type="button" class="tb-panel-reopen" id="tbCriteriaReopen" aria-label="Kriterleri göster" title="Kriterleri göster">
                        <i class="ti ti-chevron-right" aria-hidden="true"></i>
                    </button>

                    <div class="tb-results">
                        <div class="tb-results-status" id="tbStatus" hidden></div>
                        <div class="tb-results-main">
                            <div class="vs-results-wrap is-fill" id="tbResultsWrap">
                                <p class="vs-empty" id="tbEmpty">Kriterleri girin ve <strong>Bilgi Getir</strong> ile raporu çalıştırın.</p>
                                <table class="vs-results-table" id="tbResultsTable">
                                    <thead id="tbResultsHead"></thead>
                                    <tbody id="tbResultsBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <footer class="tb-results-footer" id="tbFooter" hidden>
                            <span id="tbQueryTime"></span>
                        </footer>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<script src="dev-admin-mode.js"></script>
<script src="api-client.js"></script>
<script src="user-session.js"></script>
<script src="page-permissions.js"></script>
<script src="status-bar.js"></script>
<script src="dev-user-switcher.js"></script>
<script src="theme-toggle.js"></script>
<script src="ribbon-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="report-results.js"></script>
<script src="ters-bakiye.js"></script>
</body>
</html>
