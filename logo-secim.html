<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Seçimi | Merkezi Güvenilir Finansal Veri</title>
    <style>
        :root {
            --bg: #10141f;
            --surface: #1b2130;
            --border: rgba(255, 255, 255, 0.1);
            --text: #e5e9f0;
            --muted: #9aa2b8;
            --accent: #7c9aff;
            --header: #111827;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, rgba(124, 154, 255, 0.12), transparent 40%), var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 24px 48px;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 28px;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 640px;
            margin: 0 auto;
        }

        .grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .logo-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: border-color 0.2s, transform 0.2s;
            cursor: default;
        }

        .logo-card:hover {
            border-color: rgba(124, 154, 255, 0.45);
            transform: translateY(-2px);
        }

        .logo-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(124, 154, 255, 0.25);
        }

        .preview-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            justify-content: center;
            padding: 8px 0;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .brand-mark.lg {
            width: 56px;
            height: 56px;
            border-radius: 10px;
        }

        .brand-mark.lg svg {
            width: 34px;
            height: 34px;
        }

        .title-sample {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
        }

        .logo-id {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(124, 154, 255, 0.12);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .logo-name {
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
        }

        .logo-desc {
            font-size: 0.82rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.45;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .tag {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--muted);
        }

        .pick-btn {
            margin-top: 4px;
            padding: 7px 16px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
        }

        .pick-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .pick-btn.picked {
            background: var(--accent);
            color: #fff;
        }

        .selection-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--header);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.25s;
        }

        .selection-bar.visible {
            transform: translateY(0);
        }

        .selection-bar span {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .selection-bar strong {
            color: var(--text);
        }
    </style>
</head>
<body>

<header>
    <h1>Logo Seçimi</h1>
    <p>Merkezi Güvenilir Finansal Veri / Güvenilir Data çağrışımı için logo alternatifleri. Beğendiğiniz seçeneğin altındaki <strong>“Bunu Seç”</strong> butonuna tıklayın; seçiminiz altta görünecek.</p>
</header>

<div class="grid" id="logoGrid"></div>

<div class="selection-bar" id="selectionBar">
    <span>Seçiminiz: <strong id="selectedLabel">—</strong></span>
</div>

<script>
const logos = [

    {

    {

    {

    {

    {

    {

        tags: ['Akış', 'Modern', 'Merkezi']
    },
    {
        id: 'H',
        name: 'Onay Mühürü',
        desc: 'Resmi damga / mühür. Denetlenebilir, onaylanmış kayıt hissi.',
        tags: ['Onay', 'Denetim', 'Resmi']
    },
    {
        id: 'I',
        name: 'M + Izgara',
        desc: 'Merkezi Güvenilir Finansal Veri “M”si ve tablo hücresi ızgarası. Yapılandırılmış data.',
        tags: ['Monogram', 'Tablo', 'Merkezi']

    {

];

const svgs = {

        <line x1="12" y1="12" x2="5.5" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="12" cy="4.5" r="1.6" fill="white"/>
        <circle cx="18.5" cy="16" r="1.6" fill="white"/>
        <circle cx="5.5" cy="16" r="1.6" fill="white"/>
    </svg>`,
    B: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3.5L18.5 6.5V11.5C18.5 15.5 15.8 18.8 12 19.8C8.2 18.8 5.5 15.5 5.5 11.5V6.5L12 3.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="8" y1="10" x2="16" y2="10" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="8" y1="13" x2="14" y2="13" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="8" y1="16" x2="12" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
    </svg>`,
    C: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 14C7 10.5 9.2 8 12 8C14.8 8 17 10.5 17 14" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M17 14C17 10.5 14.8 8 12 8C9.2 8 7 10.5 7 14" stroke="white" stroke-width="1.6" stroke-linecap="round" transform="translate(0,-2)"/>
        <path d="M9.5 13.5L11 15.5L14.5 11.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
    D: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 5.5H14.5C15.6 5.5 16.5 6.4 16.5 7.5V18.5H6V5.5Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M16.5 8.5H18C18.8 8.5 19.5 9.2 19.5 10V18.5H16.5" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="8.5" y1="9.5" x2="13.5" y2="9.5" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="8.5" y1="12" x2="13.5" y2="12" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="8.5" y1="14.5" x2="11.5" y2="14.5" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="13" cy="14.5" r="1.2" fill="white"/>
    </svg>`,
    E: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 14C4 14 7 10 12 10C17 10 20 14 20 14" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M5.5 15.5C5.5 15.5 8 12.5 12 12.5C16 12.5 18.5 15.5 18.5 15.5" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
        <circle cx="9" cy="7.5" r="1.3" fill="white"/>
        <circle cx="12" cy="6.5" r="1.3" fill="white"/>
        <circle cx="15" cy="7.5" r="1.3" fill="white"/>
    </svg>`,
    F: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="7" y="5" width="10" height="3.5" rx="1" stroke="white" stroke-width="1.5"/>
        <rect x="5.5" y="10" width="13" height="3.5" rx="1" stroke="white" stroke-width="1.5"/>
        <rect x="4" y="15" width="16" height="3.5" rx="1" stroke="white" stroke-width="1.5"/>
        <circle cx="12" cy="6.8" r="0.9" fill="white"/>
        <circle cx="12" cy="11.8" r="0.9" fill="white"/>
        <circle cx="12" cy="16.8" r="0.9" fill="white"/>
    </svg>`,
    G: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="12" y1="4" x2="12" y2="20" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M5 9C7 9 9 10 12 10C15 10 17 9 19 9" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M5 12C7 12 9 13 12 13C15 13 17 12 19 12" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M5 15C7 15 9 16 12 16C15 16 17 15 19 15" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="+2.2" fill="white"/>
    </svg>`,
    H: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="6" stroke="white" stroke-width="1" opacity="0.5"/>
        <path d="M9 12.2L11 14.5L15.5 9.5" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
    I: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6V18M6 6H14L10 12L14 18H6" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="16" y="8" width="2.5" height="2.5" rx="0.5" fill="white"/>
        <rect x="16" y="11.5" width="2.5" height="2.5" rx="0.5" fill="white"/>
        <rect x="16" y="15" width="2.5" height="2.5" rx="0.5" fill="white" opacity="0.55"/>
    </svg>`,
    J: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="6" y1="8" x2="18" y2="8" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="12" y1="8" x2="12" y2="11" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="5" y="11" width="5" height="4" rx="1" stroke="white" stroke-width="1.4"/>
        <rect x="14" y="11" width="5" height="4" rx="1" stroke="white" stroke-width="1.4"/>
        <line x1="7.5" y1="15" x2="7.5" y2="17.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

// Fix typo in G svg - r="+2.2" should be r="2.2"
svgs.G = svgs.G.replace('r="+2.2"', 'r="2.2"');

const grid = document.getElementById('logoGrid');
const selectionBar = document.getElementById('selectionBar');
const selectedLabel = document.getElementById('selectedLabel');

logos.forEach(logo => {
    const card = document.createElement('article');
    card.className = 'logo-card';
    card.dataset.id = logo.id;
    card.innerHTML = `
        <span class="logo-id">Seçenek ${logo.id}</span>
        <div class="preview-row">
            <div class="brand-mark">${svgs[logo.id]}</div>
            <span class="title-sample">Merkezi Güvenilir Finansal Veri</span>
        </div>
        <div class="brand-mark lg">${svgs[logo.id]}</div>
        <h2 class="logo-name">${logo.name}</h2>
        <p class="logo-desc">${logo.desc}</p>
        <div class="tags">${logo.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <button type="button" class="pick-btn" data-id="${logo.id}">Bunu Seç — ${logo.id}</button>
    `;
    grid.appendChild(card);
});

grid.addEventListener('click', e => {
    const btn = e.target.closest('.pick-btn');
    if (!btn) return;

    const id = btn.dataset.id;
    const logo = logos.find(l => l.id === id);

    document.querySelectorAll('.logo-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
    document.querySelectorAll('.pick-btn').forEach(b => {
        b.classList.toggle('picked', b.dataset.id === id);
        b.textContent = b.dataset.id === id ? `✓ Seçildi — ${id}` : `Bunu Seç — ${b.dataset.id}`;
    });

    selectedLabel.textContent = `${id} — ${logo.name}`;
    selectionBar.classList.add('visible');
});
</script>

</body>
</html>
