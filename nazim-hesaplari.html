<!DOCTYPE html>
<html lang="tr" class="page-ribbon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazım Hesapları Raporu | Merkezi Güvenilir Finansal Veri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="ribbon.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="theme-menu.css">
    <link rel="stylesheet" href="report-results.css">
    <link rel="stylesheet" href="query-results-table.css">
    <link rel="stylesheet" href="nazim-hesaplari.css">
    <script>
    (function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})();
    </script>
</head>
<body>
<div class="app">
    <div class="title-bar">
        <div class="title-bar-left">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3.5L18.5 6.5V11.5C18.5 15.5 15.8 18.8 12 19.8C8.2 18.8 5.5 15.5 5.5 11.5V6.5L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <line x1="8" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="title-bar-title">Merkezi Güvenilir Finansal Veri</span>
        </div>
        <div class="title-bar-right">
            <div class="tb-user-menu">
                <div class="tb-user-row">
                    <span class="tb-user" id="tbUser">Ahmet Yılmaz</span>
                    <div class="tb-avatar" id="tbAvatar">AY</div>
                </div>
            </div>
        </div>
    </div>
    <div class="ribbon-tabs" id="ribbonTabs">
        <div class="ribbon-tab-list"></div>
        <div class="ribbon-tabs-actions">
            <div class="theme-switch-wrap">
                <button type="button" class="theme-switch is-dark" data-theme-switch role="switch" aria-checked="true" aria-label="Koyu tema">
                    <span class="theme-switch-track">
                        <i class="ti ti-sun theme-switch-icon theme-switch-icon-sun" aria-hidden="true"></i>
                        <i class="ti ti-moon theme-switch-icon theme-switch-icon-moon" aria-hidden="true"></i>
                        <span class="theme-switch-knob"><i class="ti ti-moon theme-switch-knob-icon" aria-hidden="true"></i></span>
                    </span>
                </button>
            </div>
        </div>
    </div>
    <div class="ribbon-body" id="ribbonBody"></div>
    <div class="page-area">
        <div class="page-body page-body-nz" id="pageBody">
            <section class="nz-layout" id="nzReportRoot">
                <header class="nz-toolbar">
                    <div class="nz-toolbar-criteria">
                        <div class="nz-criteria-toolbar">
                            <button type="button" class="filter-btn" id="nzFetchBtn">Bilgi Getir</button>
                            <button type="button" class="filter-btn filter-btn-secondary" id="nzClearBtn">Temizle</button>
                        </div>
                    </div>
                    <div class="report-toolbar-results" id="nzResultsBar">
                        <p class="report-results-info" id="nzRecordInfo"></p>
                        <button type="button" class="report-export-btn" id="nzExportBtn" title="Tüm veriyi Excel'e aktar" aria-label="Tüm veriyi Excel'e aktar" disabled></button>
                    </div>
                </header>

                <div class="nz-workspace" id="nzWorkspace">
                    <aside class="nz-criteria" id="nzCriteriaPanel" aria-label="Kriterler">
                        <header class="nz-criteria-head">
                            <h3 class="nz-criteria-title">Kriterler</h3>
                            <button type="button" class="nz-panel-toggle" id="nzCriteriaToggle" aria-expanded="true" aria-controls="nzCriteriaPanel" title="Kriterleri gizle">
                                <i class="ti ti-chevron-left" aria-hidden="true"></i>
                            </button>
                        </header>
                        <form class="nz-criteria-form" id="nzCriteriaForm" autocomplete="off">
                            <div class="nz-field">
                                <label for="nzDataDate">Rapor Tarihi</label>
                                <input type="date" id="nzDataDate" name="dataDate" required>
                            </div>
                            <div class="nz-field">
                                <label for="nzLevelName">Seviye Adı</label>
                                <input type="text" id="nzLevelName" name="levelName" maxlength="100" placeholder="Opsiyonel">
                            </div>
                            <div class="nz-field-row">
                                <div class="nz-field">
                                    <label for="nzFECId">Döviz Kodu</label>
                                    <input type="number" id="nzFECId" name="fecId" inputmode="numeric" placeholder="0 = hepsi" value="0">
                                </div>
                                <div class="nz-field">
                                    <label for="nzBranchId">Şube Kodu</label>
                                    <input type="number" id="nzBranchId" name="branchId" inputmode="numeric" placeholder="Boş = hepsi">
                                </div>
                            </div>
                            <div class="nz-field-row">
                                <div class="nz-field">
                                    <label for="nzMinLedger">Min Hesap No</label>
                                    <input type="text" id="nzMinLedger" name="minToLedgerId" maxlength="50" value="977" inputmode="text" autocomplete="off">
                                </div>
                                <div class="nz-field">
                                    <label for="nzMaxLedger">Max Hesap No</label>
                                    <input type="text" id="nzMaxLedger" name="maxToLedgerId" maxlength="50" value="9980" inputmode="text" autocomplete="off">
                                </div>
                            </div>
                            <div class="nz-field">
                                <label for="nzMinDifference">Min Fark Tutarı</label>
                                <input type="number" id="nzMinDifference" name="minDifferenceAmount" step="0.01" value="0">
                            </div>
                        </form>
                    </aside>

                    <button type="button" class="nz-panel-reopen" id="nzCriteriaReopen" aria-label="Kriterleri göster" title="Kriterleri göster">
                        <i class="ti ti-chevron-right" aria-hidden="true"></i>
                    </button>

                    <div class="nz-results">
                        <div class="nz-results-status" id="nzStatus" hidden></div>
                        <div class="nz-results-main">
                            <div class="vs-results-wrap is-fill" id="nzResultsWrap">
                                <p class="vs-empty" id="nzEmpty">Kriterleri girin ve <strong>Bilgi Getir</strong> ile raporu çalıştırın.</p>
                                <table class="vs-results-table" id="nzResultsTable">
                                    <thead id="nzResultsHead"></thead>
                                    <tbody id="nzResultsBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <footer class="nz-results-footer" id="nzFooter" hidden>
                            <span id="nzQueryTime"></span>
                        </footer>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<script src="dev-admin-mode.js"></script>
<script src="api-client.js"></script>
<script src="user-session.js"></script>
<script src="page-permissions.js"></script>
<script src="status-bar.js"></script>
<script src="dev-user-switcher.js"></script>
<script src="theme-toggle.js"></script>
<script src="ribbon-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="report-results.js"></script>
<script src="nazim-hesaplari.js"></script>
</body>
</html>
