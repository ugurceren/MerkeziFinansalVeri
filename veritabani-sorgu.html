<!DOCTYPE html>
<html lang="tr" class="page-ribbon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritabanı Sorgusu | Merkezi Güvenilir Finansal Veri</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="ribbon.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="theme-menu.css">
    <link rel="stylesheet" href="query-results-table.css">
    <link rel="stylesheet" href="veritabani-baglantisi.css">
    <link rel="stylesheet" href="veritabani-sorgu.css">
    <script>
    (function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');})();
    </script>
</head>
<body>
<div class="app">

    <div class="title-bar">
        <div class="title-bar-left">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3.5L18.5 6.5V11.5C18.5 15.5 15.8 18.8 12 19.8C8.2 18.8 5.5 15.5 5.5 11.5V6.5L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <line x1="8" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="title-bar-title">Merkezi Güvenilir Finansal Veri</span>
        </div>
        <div class="title-bar-right">
            <div class="tb-user-menu">
                <div class="tb-user-row">
                    <span class="tb-user" id="tbUser">Ahmet Yılmaz</span>
                    <div class="tb-avatar" id="tbAvatar">AY</div>
                </div>
            </div>
        </div>
    </div>

    <div class="ribbon-tabs" id="ribbonTabs">
        <div class="ribbon-tab-list">
            <button class="rtab" data-tab="genel">Genel</button>
            <button class="rtab" data-tab="surec">Süreç</button>
            <button class="rtab" data-tab="mutabakat">Mutabakat</button>
            <button class="rtab" data-tab="parametre">Parametre Yönetimi</button>
            <button class="rtab active" data-tab="raporlama">Raporlama</button>
            <button class="rtab" data-tab="ayarlar">Ayarlar</button>
            <button class="rtab" data-tab="yonetim">Yönetim</button>
        </div>
        <div class="ribbon-tabs-actions">
            <div class="theme-switch-wrap">
                <button type="button" class="theme-switch is-dark" data-theme-switch role="switch" aria-checked="true" aria-label="Koyu tema">
                    <span class="theme-switch-track">
                        <i class="ti ti-sun theme-switch-icon theme-switch-icon-sun" aria-hidden="true"></i>
                        <i class="ti ti-moon theme-switch-icon theme-switch-icon-moon" aria-hidden="true"></i>
                        <span class="theme-switch-knob">
                            <i class="ti ti-moon theme-switch-knob-icon" aria-hidden="true"></i>
                        </span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div class="ribbon-body" id="ribbonBody">

        <div class="tab-panel" id="tab-genel">
            <div class="ribbon-group" style="border-right:none">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="HomePage.html">
                        <i class="ti ti-home"></i>
                        <span>Genel Bakış</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="tab-surec">
            <div class="ribbon-group" style="border-right:none">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="surec.html">
                        <i class="ti ti-timeline"></i>
                        <span>Süreç</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="tab-mutabakat">
            <div class="ribbon-group" style="border-right:none">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="mizan.html">
                        <i class="ti ti-scale"></i>
                        <span>Mizan</span>
                    </button>
                </div>
                <div class="rg-label">Mutabakat</div>
            </div>
        </div>

        <div class="tab-panel" id="tab-parametre">
            <div class="ribbon-group" style="border-right:none">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="kebir-hesaplari.html">
                        <i class="ti ti-notebook"></i>
                        <span>Kebir Hesapları<br>Sorumluluk Listesi</span>
                    </button>
                </div>
                <div class="rg-label">Parametre</div>
            </div>
        </div>

        <div class="tab-panel active" id="tab-raporlama">
            <div class="ribbon-group">
                <div class="rg-buttons">
                    <button class="rbtn active" type="button" data-page="Veritabanı Sorgusu" data-section="RAPORLAMA">
                        <i class="ti ti-database"></i>
                        <span>Veritabanı<br>Sorgusu</span>
                    </button>
                </div>
                <div class="rg-label">Sorgu</div>
            </div>
            <div class="ribbon-group">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="HomePage.html">
                        <i class="ti ti-arrows-exchange"></i>
                        <span>Ters Bakiye Raporu</span>
                    </button>
                    <button class="rbtn" type="button" data-href="HomePage.html">
                        <i class="ti ti-file-analytics"></i>
                        <span>Nazım Hesapları Raporu</span>
                    </button>
                </div>
                <div class="rg-label">Özel Raporlar</div>
            </div>
        </div>

        <div class="tab-panel" id="tab-ayarlar">
            <div class="ribbon-group" style="border-right:none">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="ayarlar.html">
                        <i class="ti ti-settings"></i>
                        <span>Uygulama Ayarları</span>
                    </button>
                </div>
                <div class="rg-label">Menü</div>
            </div>
        </div>

        <div class="tab-panel" id="tab-yonetim">
            <div class="ribbon-group" style="border-right:none">
                <div class="rg-buttons">
                    <button class="rbtn" type="button" data-href="kullanici-yonetimi.html">
                        <i class="ti ti-users"></i>
                        <span>Kullanıcı Yönetimi</span>
                    </button>
                    <button class="rbtn" type="button" data-href="veritabani-baglantisi.html">
                        <i class="ti ti-plug-connected"></i>
                        <span>Veritabanı<br>Bağlantısı</span>
                    </button>
                </div>
                <div class="rg-label">Sistem</div>
            </div>
        </div>

    </div>

    <div class="page-area">
        <div class="page-body">
            <div class="vs-layout">
                <div class="vs-workspace">
                    <div class="vs-controls">
                        <div class="vs-controls-left">
                            <span class="vs-katman-label" for="vsKatmanSelect">Katman</span>
                            <select id="vsKatmanSelect" class="vs-katman-select" aria-label="Veritabanı katmanı"></select>
                            <button type="button" class="rbtn vs-action-btn" id="vsTestBtn">Bağlantıyı Test Et</button>
                            <div class="vs-status">
                                <span class="vs-status-dot" id="vsStatusDot" aria-hidden="true"></span>
                                <span id="vsStatusText">API bağlantısı kontrol ediliyor…</span>
                            </div>
                        </div>
                        <button type="button" class="vs-new-conn-btn" id="vsNewConnBtn">
                            <i class="ti ti-plus" aria-hidden="true"></i>
                            <span>Yeni Bağlantı</span>
                        </button>
                    </div>


                    <div class="vs-query-header">
                        <label class="vs-query-label" for="vsQueryInput">SQL sorgusu</label>
                        <button type="button" class="vs-execute-btn" id="vsRunBtn" title="Sorguyu çalıştır (Ctrl+Enter)">
                            <span class="vs-execute-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4 2.5v11l9-5.5-9-5.5z"/>
                                </svg>
                            </span>
                            <span>Çalıştır</span>
                        </button>
                    </div>
                    <textarea id="vsQueryInput" class="vs-query-input" spellcheck="false" placeholder="SELECT .."></textarea>

                    <div class="vs-meta" id="vsQueryMeta"></div>
                    <div class="vs-error" id="vsQueryError" hidden role="alert"></div>

                    <div class="vs-results-wrap is-compact" id="vsResultsWrap">
                        <p class="vs-empty" id="vsResultsEmpty">Sorgu çalıştırıldığında sonuçlar burada listelenir.</p>
                        <table class="vs-results-table">
                            <thead id="vsResultsHead"></thead>
                            <tbody id="vsResultsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="vs-modal" id="vsConnModal" hidden aria-hidden="true">
        <div class="vs-modal-backdrop" data-vs-modal-close></div>
        <div class="vs-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="vsConnModalTitle">
            <header class="vs-modal-header">
                <h3 id="vsConnModalTitle">Yeni Bağlantı</h3>
                <button type="button" class="vs-modal-close" data-vs-modal-close aria-label="Kapat">
                    <i class="ti ti-x" aria-hidden="true"></i>
                </button>
            </header>
            <div class="vs-modal-body">
                <article class="dbc-panel theme-main vs-conn-panel" data-vs-conn-panel>
                    <div class="dbc-panel-body">
                        <div class="dbc-field">
                            <label for="vsConnEtiket">Bağlantı adı</label>
                            <input type="text" id="vsConnEtiket" data-conn-field="etiket" placeholder="Örn. PASIFIK — TDUTIL">
                        </div>
                        <div class="dbc-field">
                            <label for="vsConnServer">Sunucu</label>
                            <input type="text" id="vsConnServer" data-conn-field="sunucu" placeholder="PASIFIK veya srvdev\PASIFIK">
                        </div>
                        <div class="dbc-row">
                            <div class="dbc-field">
                                <label for="vsConnDatabase">Veritabanı</label>
                                <input type="text" id="vsConnDatabase" data-conn-field="veritabani" placeholder="TDUTIL">
                            </div>
                            <div class="dbc-field">
                                <label for="vsConnPort">Port</label>
                                <input type="text" id="vsConnPort" data-conn-field="port" value="1433">
                            </div>
                        </div>
                        <div class="dbc-field">
                            <label for="vsConnAuth">Kimlik Doğrulama</label>
                            <select id="vsConnAuth" data-conn-field="auth">
                                <option value="windows" selected>Windows (Entegre)</option>
                                <option value="sql">SQL Server</option>
                            </select>
                        </div>
                        <div class="dbc-field" data-conn-sql-user-wrap style="display:none">
                            <label for="vsConnSqlUser">SQL Kullanıcı Adı</label>
                            <input type="text" id="vsConnSqlUser" data-conn-field="sqlUser" placeholder="sa veya uygulama kullanıcısı">
                        </div>
                        <p class="dbc-test-msg" data-conn-test-msg role="status" hidden></p>
                        <div class="dbc-actions">
                            <button type="button" class="dbc-test-btn" data-conn-test>Bağlantıyı Test Et</button>
                            <button type="button" class="dbc-save-btn" data-conn-save>Kaydet</button>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </div>

</div>

<script src="dev-admin-mode.js"></script>
<script src="api-client.js"></script>
<script src="user-session.js"></script>
<script src="page-permissions.js"></script>
<script src="status-bar.js"></script>
<script src="dev-user-switcher.js"></script>
<script src="theme-toggle.js"></script>
<script src="ribbon-shell.js"></script>
<script src="veritabani-sorgu.js"></script>
</body>
</html>
