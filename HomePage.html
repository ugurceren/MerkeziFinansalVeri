const pageBody = document.getElementById('pageBody');

function buildDashboardHTML() {

      <article class="stat-card"><div class="stat-card-header"><div class="stat-icon green">✓</div><span class="stat-trend up">+2%</span></div><p class="stat-value">94%</p><p class="stat-label">Mutabakat Tamamlanma</p></article>
      <article class="stat-card"><div class="stat-card-header"><div class="stat-icon purple">◉</div><span class="stat-trend neutral">Aktif</span></div><p class="stat-value">12</p><p class="stat-label">Sorumlu Ekip</p></article>

    <div class="dashboard-grid">

            <div class="chart-row"><label>Banka Ekip 2</label><div class="bar-track"><div class="bar-fill" style="width:78%"></div></div><span class="pct">78%</span></div>
            <div class="chart-row"><label>Banka Ekip 3</label><div class="bar-track"><div class="bar-fill" style="width:85%"></div></div><span class="pct">85%</span></div>
            <div class="chart-row"><label>Merkezi Kontrol</label><div class="bar-track"><div class="bar-fill" style="width:96%"></div></div><span class="pct">96%</span></div>
          </div>
        </div>
        ${buildPortalDatasetCardHTML()}
        <div class="dashboard-panel">
          <div class="panel-head"><h4>Son Aktiviteler</h4><span>Canlı akış</span></div>
          <ul class="activity-list">
            <li class="activity-item"><div class="activity-dot edit">✎</div><div class="activity-body"><strong>Kurumsal Hesap 3 güncellendi</strong><span>Mehmet Kara — Sorumlu ekip değişikliği</span></div><span class="activity-time">12 dk önce</span></li>
            <li class="activity-item"><div class="activity-dot alert">!</div><div class="activity-body"><strong>7 hesapta aksiyon bekleniyor</strong><span>Banka Ekip 2 — Doğrulama süreci</span></div><span class="activity-time">1 saat önce</span></li>
            <li class="activity-item"><div class="activity-dot ok">✓</div><div class="activity-body"><strong>Ocak mutabakatı onaylandı</strong><span>Merkezi Kontrol — Mizan eşleşmesi tamam</span></div><span class="activity-time">3 saat önce</span></li>
            <li class="activity-item"><div class="activity-dot export">↓</div><div class="activity-body"><strong>Excel dışa aktarım tamamlandı</strong><span>Ayşe Demir — Gelir tablosu raporu</span></div><span class="activity-time">Dün 16:42</span></li>
          </ul>
        </div>
      </div>
      <div class="dashboard-side">
        <div class="dashboard-panel">
          <div class="panel-head"><h4>Hızlı Erişim</h4></div>
          <div class="quick-links">

            <a class="quick-link" href="mizan.html"><span class="quick-link-icon">⊞</span>Mizan Görüntüle</a>
            <a class="quick-link" href="veritabani-sorgu.html"><span class="quick-link-icon">◫</span>Veritabanı Sorgusu</a>
            <a class="quick-link" href="#" data-quick-page="Ters Bakiye Raporu" data-quick-section="RAPORLAMA"><span class="quick-link-icon">⇄</span>Ters Bakiye Raporu</a>
          </div>
        </div>
        <div class="dashboard-panel">
          <div class="panel-head"><h4>Ekip İş Yükü</h4><span>Bekleyen görev</span></div>
          <div class="team-load-list">
            <div class="team-load-item"><div class="team-load-header"><span>Banka Ekip 1</span><span>14 görev</span></div><div class="load-track"><div class="load-fill high" style="width:82%"></div></div></div>
            <div class="team-load-item"><div class="team-load-header"><span>Banka Ekip 2</span><span>11 görev</span></div><div class="load-track"><div class="load-fill medium" style="width:65%"></div></div></div>
            <div class="team-load-item"><div class="team-load-header"><span>Banka Ekip 3</span><span>8 görev</span></div><div class="load-track"><div class="load-fill low" style="width:48%"></div></div></div>

            <div class="status-item"><span>Merkezi Sistem</span><span class="status-badge online">Çevrimiçi</span></div>

}

const tableData = [
  [1,1,'Kurumsal Hesap 1','Banka Ekip 1','Ödeme İşlemi','Banka Sistemi','2024-01-15','2024-01-20','Ahmet Yılmaz','Mehmet Kara'],
  [2,2,'Kurumsal Hesap 2','Banka Ekip 2','Hesap Aktarımı','Merkezi Sistem','2024-01-18','2024-01-21','Ayşe Demir','Zeynep Can'],
  [3,3,'Kurumsal Hesap 3','Banka Ekip 1','Kaydı Güncelle','Banka Sistemi','2024-01-20','2024-01-22','Mehmet Kara','Ahmet Yılmaz'],
  [4,4,'Kurumsal Hesap 4','Banka Ekip 3','Doğrulama Bekle','Merkezi Sistem','2024-01-22','2024-01-23','Fatih Şahin','Seda Yıldız'],
  [5,5,'Kurumsal Hesap 5','Banka Ekip 2','Bilgi Eksik','Banka Sistemi','2024-01-23','2024-01-24','Zeynep Can','Ayşe Demir'],
  [6,6,'Kurumsal Hesap 6','Banka Ekip 1','İzin Bekle','Merkezi Sistem','2024-01-25','2024-01-26','Seda Yıldız','Fatih Şahin'],
  [7,7,'Kurumsal Hesap 7','Banka Ekip 3','Ödeme İşlemi','Banka Sistemi','2024-01-26','2024-01-27','Ahmet Yılmaz','Mehmet Kara'],
  [8,8,'Kurumsal Hesap 8','Banka Ekip 2','Hesap Aktarımı','Merkezi Sistem','2024-01-27','2024-01-28','Zeynep Can','Ayşe Demir'],
  [9,9,'Kurumsal Hesap 9','Banka Ekip 1','Kaydı Güncelle','Banka Sistemi','2024-01-28','2024-01-29','Fatih Şahin','Seda Yıldız'],
  [10,10,'Kurumsal Hesap 10','Banka Ekip 3','Doğrulama Bekle','Merkezi Sistem','2024-01-29','2024-01-30','Mehmet Kara','Ahmet Yılmaz'],
];

function buildTableHTML(data) {
  const rows = data.map(r => `<tr>
    <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
    <td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td>
    <td>${r[8]}</td><td>${r[9]}</td>
    <td><button class="edit-btn">Düzenle</button><button class="del-btn">Sil</button></td>
  </tr>`).join('');
  return `<div class="table-card">
    <div class="tc-head">
      <div><h3>Kurumsal Hesaplar</h3><p>Bankadaki görevli ekipler tarafından yönetilen hesaplar.</p></div>
      <button class="add-btn">+ Yeni Hesap Ekle</button>
    </div>
    <div class="filter-bar">
      <div class="fg"><label>Hesap Adı</label><input type="text" id="fName" placeholder="Hesap adı ara..."></div>
      <div class="fg"><label>Ekip</label><input type="text" id="fTeam" placeholder="Ekip ara..."></div>
      <div class="fg"><label>Hesap ID Aralığı</label>
        <div class="filter-range">
          <input type="number" id="fMin" placeholder="Min">
          <span class="range-dash">—</span>
          <input type="number" id="fMax" placeholder="Max">
        </div>
      </div>
      <button class="filter-btn" onclick="applyFilter()">Filtrele</button>
    </div>
    <div style="overflow-x:auto">
      <table id="mainTable">
        <thead><tr>
          <th>Hesap No</th><th>HesapID</th><th>Hesap Adı</th><th>Sorumlu Ekip</th>
          <th>Alınması Beklenen Aksiyon</th><th>Kaynak</th><th>Kayıt Tarihi</th>
          <th>Güncelleme Tarihi</th><th>Kaydı Oluşturan</th><th>Güncelleyen</th><th>İşlemler</th>
        </tr></thead>
        <tbody id="tableBody">${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function applyFilter() {
  const name = document.getElementById('fName').value.toLowerCase();
  const team = document.getElementById('fTeam').value.toLowerCase();
  const min = parseInt(document.getElementById('fMin').value) || 0;
  const max = parseInt(document.getElementById('fMax').value) || 99999;
  const filtered = tableData.filter(r =>
    r[2].toLowerCase().includes(name) &&
    r[3].toLowerCase().includes(team) &&
    r[1] >= min && r[1] <= max
  );
  document.getElementById('tableBody').innerHTML = filtered.map(r => `<tr>
    <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
    <td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td>
    <td>${r[8]}</td><td>${r[9]}</td>
    <td><button class="edit-btn">Düzenle</button><button class="del-btn">Sil</button></td>
  </tr>`).join('');
}

const iconMap = {
  'Portal': 'ti-home',
  'Kebir Hesapları Sorumluluk Listesi': 'ti-notebook',
  'Mizan': 'ti-scale',
  'Veritabanı Sorgusu': 'ti-database',
  'Veri Kalitesi Kuralları': 'ti-list-check',
  'Günlük Kural Sonuçları': 'ti-calendar-stats',
  'Ters Bakiye Raporu': 'ti-arrows-exchange',
  'Nazım Hesapları Raporu': 'ti-file-analytics',
  'Kullanıcı Yönetimi': 'ti-users',
  'Veritabanı Bağlantısı': 'ti-plug-connected',
  'Uygulama Ayarları': 'ti-settings'
};

function activateTab(section) {
  if (typeof window.activateRibbonSection === 'function') {
    window.activateRibbonSection(section);
  }
}

function setPage(section, page, options = {}) {
  if (options.href) {
    window.location.href = options.href;
    return;
  }

  activateTab(section);

  if (page === 'Portal') {
    pageBody.innerHTML = buildDashboardHTML();
    bindQuickLinks();
    return;
  }

  if (page === 'Kebir Hesapları Sorumluluk Listesi') {
    pageBody.innerHTML = buildTableHTML(tableData);
    return;
  }

  if (page === 'Mizan') {
    initMizanPage(pageBody);
    return;
  }

  if (page === 'Veri Kalitesi Kuralları') {
    initVeriKalitesiKurallariPage(pageBody);
    return;
  }

  if (page === 'Günlük Kural Sonuçları') {
    initGunlukKuralSonuclariPage(pageBody);
    return;
  }

  if (page === 'Uygulama Ayarları') {
    pageBody.innerHTML = buildAyarlarHTML();
    initAyarlarPage(pageBody);
    return;
  }

  const icon = iconMap[page] || 'ti-file';
  pageBody.innerHTML = `<div class="placeholder-page">
    <i class="ti ${icon}"></i>
    <p>${page}</p>
    <span>Bu sayfa için içerik buraya gelecek.</span>
  </div>`;
}

function bindQuickLinks() {
  pageBody.querySelectorAll('[data-quick-page]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const page = link.dataset.quickPage;
      const section = link.dataset.quickSection;
      activateTab(section);
      if (typeof window.activateRibbonButton === 'function') {
        window.activateRibbonButton(page);
      }
      setPage(section, page);
    });
  });
}

window.handleRibbonPage = function(section, page) {
  setPage(section, page);
};

document.addEventListener('ribbon-ready', function(e) {
  initUserBar();
  initThemeMenu();
  const state = e.detail || (typeof detectRibbonState === 'function' ? detectRibbonState() : null);
  const section = state?.section || 'PORTAL';
  const page = state?.page || 'Portal';
  setPage(section, page);
});
</script>
</body>
